server.port=${PORT:8080}
spring.application.name=skillsharing

# configuracion de base de datos postgresql (supabase)
spring.datasource.url=jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
spring.datasource.username=postgres.sjffgnupnvpghrcyfcby
spring.datasource.password=Grupo1IS2%123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=12

# hibernate y jpa
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# flyway para migraciones (se encarga de crear las tablas)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# clave secreta para jwt (debe ser sobrescrita en prod con variable de entorno)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# configuracion smtp2go para envio de correos (verificacion de cuenta - hu29)
# render bloquea gmail smtp directo, por eso se usa smtp2go
spring.mail.host=${SMTP_HOST:mail.smtp2go.com}
spring.mail.port=${SMTP_PORT:2525}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.test-connection=false
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# url base del backend (usada para generar el enlace de verificacion en el correo)
app.base-url=${APP_BASE_URL:https://skillsharing-api.onrender.com}
app.email.from=${APP_EMAIL_FROM:}
app.email.verification-enabled=true
app.verification.token.expiry-ms=1800000

# directorio de almacenamiento local de materiales educativos - us05/us27
app.uploads.dir=${UPLOADS_DIR:uploads}
# configuracion multipart para subida de archivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
